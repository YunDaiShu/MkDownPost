name: site-health

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00（北京 06:00）
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 相对导入完整性
        run: node tools/check-imports.mjs
      - name: 硬编码颜色 lint
        run: node tools/lint-hardcoded-color.mjs
      - name: CSS 产物是否最新（critical / rest / index 内联块）
        run: |
          node tools/bundle-css.mjs
          node tools/build-seo.mjs
          if ! git diff --quiet -- assets/styles/critical.css assets/styles/rest.css index.html sitemap.xml sitemap.txt 'a/'; then
            echo "构建产物已过期：请本地运行 node tools/bundle-css.mjs && node tools/build-seo.mjs 后提交"
            git --no-pager diff --stat
            exit 1
          fi
      - name: Markdown 解析冒烟
        run: node tools/smoke-md.mjs

  live-checks:
    runs-on: ubuntu-latest
    needs: offline-checks
    steps:
      - name: 线上 5 个路由可访问且能渲染
        run: |
          set -e
          BASE="https://yundaishu.github.io/MkDownPost/"
          for route in "" "#/editor" "#/themes" "#/about" "#/article/getting-started"; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 30 "${BASE}${route}")
            echo "${route:-/} -> $code"
            test "$code" = "200"
            if grep -q '页面加载失败' /tmp/page.html; then echo "渲染失败: $route"; exit 1; fi
          done
          echo "全部通过"
