name: site-health

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 每天 UTC 22:00（北京 06:00）
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 相对导入完整性
        run: node tools/check-imports.mjs
      - name: 硬编码颜色 lint
        run: node tools/lint-hardcoded-color.mjs
      - name: 设计尺度检查（字号 / 间距 / 圆角 / 字重）
        run: node tools/check-scale.mjs


      - name: 主题数据校验（字段 / 枚举 / 色值格式）
        run: node tools/check-themes-schema.mjs

      - name: 单元测试（node:test，零依赖）
        run: node --test tests/themes.test.mjs

      - name: 构建产物一致性（CSS / 静态页 / sitemap）
        run: |
          node tools/bundle-css.mjs
          node tools/build-seo.mjs
          node tools/check-artifacts.mjs
      - name: 版本戳跟随内容哈希（只校验，过期即失败）
        run: node tools/stamp-version.mjs --check
      - name: 交互规范校验（层叠顺序 / hover 两族 / 焦点 / 图标配平 / 明暗对比度）
        run: node tools/check-interaction.mjs
      - name: UI 一致性浏览器实测（光环唯一 / 无死 hover / 同类零差异；无浏览器自动跳过）
        env:
          CHROME_PATH: ${{ vars.CHROME_PATH }}
        run: node tools/check-ui-consistency.mjs
      - name: Markdown 解析冒烟
        run: node tools/smoke-md.mjs

  live-checks:
    runs-on: ubuntu-latest
    needs: offline-checks
    steps:
      - name: 线上 5 个路由可访问且能渲染
        run: |
          set -e
          BASE="https://yundaishu.github.io/MkDownPost/"
          for route in "" "#/editor" "#/themes" "#/about" "#/article/getting-started"; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' --max-time 30 "${BASE}${route}")
            echo "${route:-/} -> $code"
            test "$code" = "200"
            if grep -q '页面加载失败' /tmp/page.html; then echo "渲染失败: $route"; exit 1; fi
          done
          echo "全部通过"
